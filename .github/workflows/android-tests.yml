name: Android Instrumented Tests

on:
  push:
    branches: [ master, development, feature/run-android-tests ]
  pull_request:
    branches: [ master, development ]

jobs:
  instrumented-tests:
    runs-on: macos-latest # macOS runners provide reliable hardware-accelerated KVM/Hypervisor support for Android emulators

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x sudoq-app/gradlew

      - name: "Run Instrumented UI Tests (AVD: API 36, Play Store, 2GB RAM)"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          ram-size: 2048M
          heap-size: 336M
          disk-size: 6G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            cd sudoq-app
            ./gradlew connectedDebugAndroidTest --stacktrace
